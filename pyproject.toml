[project]
name = "subscription-ledger"
version = "0.1.0"
description = "私人订阅账本：Flask + SQLite + 原生前端，人民币，手动记账"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.2",
    "Werkzeug==3.1.8",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
